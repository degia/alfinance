services:
  app:
    build: .
    image: alfinance-app
    container_name: alfinance_app
    restart: always
    volumes:
      - .:/var/www
    depends_on:
      - redis
    networks:
      - alfinance_net

  queue:
    image: alfinance-app
    container_name: alfinance_queue
    restart: always
    command: php artisan horizon
    volumes:
      - .:/var/www
    depends_on:
      - app
      - redis
    networks:
      - alfinance_net

  scheduler:
    image: alfinance-app
    container_name: alfinance_scheduler
    restart: always
    command: php artisan schedule:work
    volumes:
      - .:/var/www
    depends_on:
      - app
      - redis
    networks:
      - alfinance_net

  redis:
    image: redis:alpine
    container_name: alfinance_redis
    restart: always
    networks:
      - alfinance_net

  nginx:
    image: nginx:alpine
    container_name: alfinance_nginx
    restart: always
    ports:
      - "8087:80"
    volumes:
      - .:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - alfinance_net

networks:
  alfinance_net:
    driver: bridge

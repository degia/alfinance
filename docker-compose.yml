services:
  app:
    build:
      context: .
      target: app
    image: alfinance-app
    container_name: alfinance_app
    restart: always
    env_file:
      - .env
    ports:
      - "8087:80"
    volumes:
      - storage_app:/var/www/storage/app
      - storage_logs:/var/www/storage/logs
    depends_on:
      - redis
    networks:
      - alfinance_net

  queue:
    image: alfinance-app
    container_name: alfinance_queue
    restart: always
    command: php artisan horizon
    env_file:
      - .env
    volumes:
      - storage_app:/var/www/storage/app
      - storage_logs:/var/www/storage/logs
    depends_on:
      - app
      - redis
    networks:
      - alfinance_net

  scheduler:
    image: alfinance-app
    container_name: alfinance_scheduler
    restart: always
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - storage_app:/var/www/storage/app
      - storage_logs:/var/www/storage/logs
    depends_on:
      - app
      - redis
    networks:
      - alfinance_net

  redis:
    image: redis:alpine
    container_name: alfinance_redis
    restart: always
    networks:
      - alfinance_net

networks:
  alfinance_net:
    driver: bridge

volumes:
  storage_app:
  storage_logs:
